<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OP Cards Tracker</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1b1f2a;--mu:#6b7080;--ac:#c8372d;--ok:#1f8a4c;--bad:#c8372d;--bd:#e3e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1e212b;--tx:#eceef4;--mu:#9aa0b2;--ac:#ff6a5e;--ok:#4cc380;--bad:#ff7a70;--bd:#2c303d}}
:root[data-theme="dark"]{--bg:#14161d;--card:#1e212b;--tx:#eceef4;--mu:#9aa0b2;--ac:#ff6a5e;--ok:#4cc380;--bad:#ff7a70;--bd:#2c303d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k{color:var(--mu);font-size:12px}
.v{font-size:21px;font-weight:700;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
h2{font-size:15px;margin:18px 0 8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.sm{font-size:12px;color:var(--mu)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:14px;font-weight:600}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
.del{background:none;border:0;color:var(--mu);font-size:18px;padding:0 4px}
.toast{margin-top:10px;color:var(--ok);font-size:14px;min-height:20px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mu);font:inherit;font-size:12px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--ac);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin:4px 4px 0 0}
.empty{color:var(--mu);text-align:center;padding:30px 10px}
</style></head>
<body>
<main>
<h1>🏴‍☠️ OP Cards Tracker</h1>
<div class="sub" id="status">Chargement…</div>
<div id="view"></div>
</main>
<nav id="nav"></nav>
<script>
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x instanceof Node?x:document.createTextNode(x==null?'':String(x))));return e};
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const today=()=>new Date().toISOString().slice(0,10);
let sig=null,sigF='opp',cat={q:'',t:'',g:'',r:'',v:'',min:5,sort:'price_desc',n:100},items=[],tab='sum',ref=null,loaded=false,form={type:'achat',date:today(),platform:'Cardmarket'},toast='';
const PLATS=['Cardmarket','CardTrader','eBay','Vinted','Leboncoin','TCGplayer','Magasin / boutique','Autre'];

function setStatus(t){document.getElementById('status').textContent=t}
function compute(){
  const s=[...items].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
  const inv={};let profit=0,rev=0,spent=0,sold=0,cogs=0;
  for(const t of s){
    const k=(t.code||t.name).trim().toUpperCase()+(t.ver?'|'+t.ver.trim().toUpperCase():'')+'|'+(t.lang||'EN');
    const i=inv[k]||(inv[k]={name:t.name,code:t.code,ver:t.ver||'',lang:t.lang||'EN',qty:0,cost:0,profit:0,sold:0});
    if(t.type==='achat'){const c=t.qty*t.price+t.fees;i.qty+=t.qty;i.cost+=c;spent+=c}
    else{
      const avg=i.qty>0?i.cost/i.qty:0,net=t.qty*t.price-t.fees,cg=t.qty*avg,p=net-cg;
      i.profit+=p;profit+=p;rev+=net;cogs+=cg;i.sold+=t.qty;sold+=t.qty;i.qty-=t.qty;i.cost-=cg;
      if(i.qty<0){i.qty=0;i.cost=0}
    }
  }
  const stockCost=Object.values(inv).reduce((a,x)=>a+x.cost,0);
  return{inv,profit,rev,spent,sold,cogs,stockCost,roi:cogs>0?profit/cogs:0};
}
function save(){try{localStorage.setItem('opt',JSON.stringify(items))}catch(e){setStatus('⚠️ Sauvegarde locale impossible')}}
function stat(k,v,cls){return h('div',{class:'card'},h('div',{class:'k'},k),h('div',{class:'v '+(cls||'')},v))}
const sign=n=>n>=0?'pos':'neg';

function viewSum(){
  const c=compute(),box=h('div');
  box.append(h('div',{class:'grid'},
    stat('Profit réalisé',eur(c.profit),sign(c.profit)),
    stat('ROI sur ventes',(c.roi*100).toFixed(1)+' %',sign(c.roi)),
    stat('Stock (au coût)',eur(c.stockCost)),
    stat('Chiffre d’affaires net',eur(c.rev)),
    stat('Total acheté',eur(c.spent)),
    stat('Cartes vendues',c.sold)));
  const top=Object.values(c.inv).filter(x=>x.sold>0).sort((a,b)=>b.profit-a.profit).slice(0,5);
  box.append(h('h2',{},'Meilleures cartes'));
  box.append(top.length?h('div',{class:'card'},top.map(x=>h('div',{class:'row'},h('div',{},x.name,h('div',{class:'sm'},x.code||'')),h('b',{class:sign(x.profit)},eur(x.profit))))):h('div',{class:'empty'},'Aucune vente enregistrée pour le moment.'));
  box.append(h('div',{class:'sub',style:'margin-top:14px'},'Profit calculé au coût moyen par carte, frais inclus.'));
  box.append(h('h2',{},'Sauvegarde (changer d’appareil)'),h('div',{class:'two'},h('button',{class:'btn',style:'margin-top:0',onclick:exportData},'Exporter'),h('button',{class:'btn',style:'margin-top:0',onclick:importData},'Importer')));
  box.append(ctCard());
  return box;
}
const CT='https://api.cardtrader.com/api/v2',CT_CODE=/\b((?:OP|EB|PRB|ST)\d{2}-\d{3}|P-\d{3})\b/i;
let ctMsg='',ctBad=false;
function ctSay(t,bad){ctMsg=t;ctBad=!!bad;const e=document.getElementById('ctMsg');if(e){e.textContent=t;e.style.color=bad?'var(--bad)':'var(--ok)'}}
async function ctGet(path,tok){
  const r=await fetch(CT+path,{headers:{Authorization:'Bearer '+tok}});
  if(r.status===401||r.status===403)throw new Error('AUTH');
  if(r.status===429)throw new Error('RATE');
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
const ctList=x=>Array.isArray(x)?x:(x&&x.array)||[];
function ctToken(){
  const v=(document.getElementById('ctTok').value||'').trim().replace(/^Bearer\s+/i,'');
  try{if(v&&document.getElementById('ctKeep').checked)localStorage.setItem('ct_tok',v);else localStorage.removeItem('ct_tok')}catch(e){}
  return v;
}
const ctErr=e=>e.message==='AUTH'?'Jeton refusé : vérifie-le dans CardTrader (paramètres du profil).':e.message==='RATE'?'Trop de requêtes, réessaie dans une minute.':e instanceof TypeError?'Connexion à CardTrader impossible : le navigateur est probablement bloqué (CORS) ou le réseau est coupé. Dis-le-moi : je te propose l’option script sur PC.':'Erreur CardTrader ('+e.message+').';
async function ctTest(){
  const t=ctToken();if(!t)return ctSay('Colle d’abord ton jeton.',1);
  ctSay('Test en cours…');
  try{const i=await ctGet('/info',t);ctSay('✓ Connexion OK'+(i&&i.name?' ('+i.name+')':'')+'. Tu peux importer.')}catch(e){ctSay(ctErr(e),1)}
}
async function ctImport(){
  const tok=ctToken();if(!tok)return ctSay('Colle d’abord ton jeton.',1);
  try{
    ctSay('Recherche du jeu One Piece…');
    const op=ctList(await ctGet('/games',tok)).find(g=>/one\s*piece/i.test((g.display_name||'')+' '+(g.name||'')));
    if(!op)return ctSay('Jeu One Piece introuvable dans CardTrader.',1);
    const have=new Set(items.map(t=>t.ext).filter(Boolean));
    const st={A:0,V:0,dup:0,other:0,noEur:0,noCode:0,orders:0};let n=0;
    for(const role of ['buyer','seller']){
      const seen=new Set();
      for(let page=1;page<=60;page++){
        ctSay('Lecture des '+(role==='buyer'?'achats':'ventes')+' (page '+page+')…');
        const orders=ctList(await ctGet('/orders?order_as='+role+'&sort=date.desc&page='+page+'&limit=100',tok));
        if(!orders.length||seen.has(orders[0].id))break;
        orders.forEach(o=>seen.add(o.id));st.orders+=orders.length;
        for(const o of orders){
          if(!['paid','sent','arrived','done'].includes(String(o.state||'')))continue;
          const pr=i=>{const p=role==='buyer'?(i.buyer_price||i.price):(i.seller_price||i.price);return p&&typeof p.cents==='number'?p:null};
          const mine=[];
          for(const i of (o.order_items||[])){
            if(Number(i.game_id)!==op.id){st.other++;continue}
            const p=pr(i);if(!p||p.currency!=='EUR'){st.noEur++;continue}
            mine.push({i,unit:p.cents/100,qty:Number(i.quantity)||1});
          }
          const total=mine.reduce((a,x)=>a+x.unit*x.qty,0);
          const ex=role==='buyer'?(o.order_shipping_method&&o.order_shipping_method.buyer_price):(o.seller_fee_amount||o.fee_amount);
          const extra=ex&&ex.currency==='EUR'?ex.cents/100:0;
          const date=String(o.paid_at||o.created_at||o.sent_at||o.updated_at||'').slice(0,10)||today();
          for(const {i,unit,qty} of mine){
            const ext='ct:'+o.id+':'+(i.id||i.blueprint_id);
            if(have.has(ext)){st.dup++;continue}
            const pp=i.properties_hash||i.properties||{},lk=Object.keys(pp).find(k=>/language/i.test(k)),lv=lk?String(pp[lk]).toLowerCase():'';
            const lang=!lv?'EN':/^(en|english)/.test(lv)?'EN':/^(jp|ja|japanese)/.test(lv)?'JP':/^(fr|french)/.test(lv)?'FR':'Autre';
            const raw=String(i.name||i.name_en||''),m=(raw+' '+(i.collector_number||'')+' '+JSON.stringify(pp)).match(CT_CODE),code=m?m[1].toUpperCase():'';
            if(!code)st.noCode++;
            items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now()+(n++),type:role==='buyer'?'achat':'vente',
              name:raw.replace(/\s*\(?\b(?:(?:OP|EB|PRB|ST)\d{2}-\d{3}|P-\d{3})\b\)?/i,'').trim()||raw,code,set:code?code.split('-')[0]:'',qty,price:unit,
              fees:total>0?Math.round(extra*unit*qty/total*100)/100:0,date,platform:'CardTrader',
              note:'CardTrader #'+o.id+(pp.condition?' · '+pp.condition:''),ver:'',lang,ext});
            have.add(ext);role==='buyer'?st.A++:st.V++;
          }
        }
        await new Promise(r=>setTimeout(r,120));
      }
    }
    save();render();
    ctSay('✓ '+(st.A+st.V)+' importées ('+st.A+' achats, '+st.V+' ventes) sur '+st.orders+' commandes lues. Déjà présentes : '+st.dup+' · hors One Piece : '+st.other+' · hors € ignorées : '+st.noEur+' · sans code carte : '+st.noCode+'.');
  }catch(e){ctSay(ctErr(e),1)}
}
function ctShape(){
  const tok=ctToken();if(!tok)return ctSay('Colle d’abord ton jeton.',1);
  const shape=(v,k)=>k==='properties_hash'?v:Array.isArray(v)?[v.length?shape(v[0]):'vide']:v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([a,b])=>[a,shape(b,a)])):v===null?'null':typeof v;
  ctGet('/orders?order_as=buyer&sort=date.desc&limit=1',tok).then(l=>{
    const o=ctList(l)[0],ta=document.getElementById('ctShape');
    ta.style.display='block';ta.value=JSON.stringify(o?shape(o):'aucune commande',null,1);ta.select&&ta.select();
    ctSay('Copie le contenu ci-dessous et envoie-le moi (types seulement, pas de données personnelles).');
  }).catch(e=>ctSay(ctErr(e),1));
}
function ctCard(){
  let saved='';try{saved=localStorage.getItem('ct_tok')||''}catch(e){}
  return h('div',{},h('h2',{},'CardTrader'),h('div',{class:'card'},
    h('div',{class:'sm'},'Jeton : CardTrader → paramètres du profil. Il reste sur cet appareil et n’est envoyé qu’à CardTrader.'),
    h('label',{},'Jeton d’accès'),h('input',{id:'ctTok',type:'password',autocomplete:'off',value:saved}),
    h('label',{style:'display:flex;gap:8px;align-items:center'},h('input',{id:'ctKeep',type:'checkbox',style:'width:auto',...(saved?{checked:''}:{})}),'Mémoriser sur cet appareil'),
    h('div',{class:'two'},h('button',{class:'btn',style:'margin-top:12px',onclick:ctTest},'Tester'),h('button',{class:'btn',style:'margin-top:12px',onclick:ctImport},'Importer')),
    h('button',{class:'btn',style:'background:var(--bd);color:var(--tx)',onclick:ctShape},'Copier la structure (diagnostic)'),
    h('div',{class:'toast',id:'ctMsg',style:'color:'+(ctBad?'var(--bad)':'var(--ok)')},ctMsg),
    h('textarea',{id:'ctShape',readonly:'',style:'display:none;width:100%;height:150px;margin-top:8px'})));
}
function exportData(){const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(items)],{type:'application/json'})),download:'op-tracker-'+today()+'.json'});document.body.append(a);a.click();a.remove()}
function importData(){const i=h('input',{type:'file',accept:'.json,application/json'});i.addEventListener('change',async()=>{try{const d=JSON.parse(await i.files[0].text());if(!Array.isArray(d))throw 0;if(confirm('Remplacer les '+items.length+' transactions actuelles par '+d.length+' importées ?')){items=d;save();render()}}catch(e){alert('Fichier invalide.')}});i.click()}
function viewAdd(){
  const names=[...new Set(items.map(t=>t.name))];
  const f=(id,v)=>{const e=document.getElementById(id);return e?e.value:v};
  const box=h('div',{class:'card'});
  const seg=h('div',{class:'seg'},['achat','vente'].map(t=>h('button',{type:'button',class:form.type===t?'on':'',onclick:()=>{form.type=t;render()}},t==='achat'?'Achat':'Vente')));
  const dl=h('datalist',{id:'names'},names.map(n=>h('option',{value:n})));
  const name=h('input',{id:'name',list:'names',placeholder:'Ex : Monkey D. Luffy (Alt Art)',autocomplete:'off'});
  const code=h('input',{id:'code',placeholder:'Ex : OP05-119'});
  name.addEventListener('change',()=>{const m=items.find(t=>t.name===name.value);if(m){code.value=m.code||'';document.getElementById('set').value=m.set||'';document.getElementById('ver').value=m.ver||'';document.getElementById('lang').value=m.lang||'EN'}});
  const plat=h('select',{id:'plat'},PLATS.map(p=>h('option',{value:p,...(p===form.platform?{selected:''}:{})},p)));
  box.append(seg,dl,
    h('label',{},'Carte'),name,
    h('div',{class:'two'},h('div',{},h('label',{},'Code'),code),h('div',{},h('label',{},'Set'),h('input',{id:'set',placeholder:'Ex : OP05'}))),
    h('div',{class:'two'},h('div',{},h('label',{},'Quantité'),h('input',{id:'qty',type:'number',min:'1',value:'1',inputmode:'numeric'})),h('div',{},h('label',{},'Prix unitaire (€)'),h('input',{id:'price',type:'number',min:'0',step:'0.01',inputmode:'decimal'}))),
    h('div',{class:'two'},h('div',{},h('label',{},'Frais / port (€)'),h('input',{id:'fees',type:'number',min:'0',step:'0.01',value:'0',inputmode:'decimal'})),h('div',{},h('label',{},'Date'),h('input',{id:'date',type:'date',value:form.date}))),
    h('label',{},'Version Cardmarket (optionnel)'),h('input',{id:'ver',placeholder:'V.1, V.2…'}),h('label',{},'Langue de la carte'),h('select',{id:'lang'},['EN','JP','FR','Autre'].map(l=>h('option',{value:l},l))),h('label',{},'Plateforme'),plat,
    h('label',{},'Note (optionnel)'),h('input',{id:'note'}),
    h('button',{class:'btn',onclick:add},'Enregistrer'),
    h('div',{class:'toast',id:'toast'},toast));
  return box;
}
function add(){
  const g=id=>document.getElementById(id).value.trim();
  const name=g('name'),qty=parseInt(g('qty'),10),price=parseFloat(g('price')),fees=parseFloat(g('fees')||'0')||0;
  const t=document.getElementById('toast');
  if(!name||!(qty>0)||!(price>=0)||g('price')===''){t.style.color='var(--bad)';t.textContent='Nom, quantité et prix sont requis.';return}
  items.push({id:Date.now().toString(36),ts:Date.now(),type:form.type,name,code:g('code'),set:g('set'),qty,price,fees,date:g('date')||today(),platform:g('plat'),note:g('note'),ver:g('ver'),lang:g('lang')});
  form.date=g('date')||today();form.platform=g('plat');
  toast='✓ '+(form.type==='achat'?'Achat':'Vente')+' enregistré(e)';
  save();render();
}
function viewHist(){
  if(!items.length)return h('div',{class:'empty'},'Aucune transaction. Ajoute ton premier achat !');
  const s=[...items].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.ts-a.ts);
  return h('div',{class:'card'},s.map(t=>h('div',{class:'row'},
    h('div',{},h('b',{},t.name),h('div',{class:'sm'},[t.date,t.code,t.lang||'EN',t.platform,t.qty+' × '+eur(t.price),t.fees?'frais '+eur(t.fees):''].filter(Boolean).join(' · ')),t.note?h('div',{class:'sm'},t.note):''),
    h('div',{style:'text-align:right'},h('b',{class:t.type==='vente'?'pos':''},(t.type==='vente'?'+':'−')+eur(t.qty*t.price)),h('div',{},h('button',{class:'del',title:'Supprimer',onclick:()=>{if(confirm('Supprimer cette transaction ?')){items=items.filter(x=>x.id!==t.id);save();render()}}},'🗑')))
  )));
}
function viewStock(){
  const c=compute(),list=Object.values(c.inv).filter(x=>x.qty>0).sort((a,b)=>b.cost-a.cost);
  if(!list.length)return h('div',{class:'empty'},'Stock vide.');
  return h('div',{},h('div',{class:'sub'},list.reduce((a,x)=>a+x.qty,0)+' cartes · '+eur(c.stockCost)+' au coût'),
    h('div',{class:'card'},list.map(x=>h('div',{class:'row'},h('div',{},h('b',{},x.name),h('div',{class:'sm'},[x.code,x.ver,x.lang].filter(Boolean).join(' · '))),h('div',{style:'text-align:right'},h('b',{},'×'+x.qty),h('div',{class:'sm'},'coût moy. '+eur(x.cost/x.qty)))))));
}
function viewSig(){
  if(!sig||!sig.rows)return h('div',{class:'empty'},'Aucun signal pour le moment. Lance l’action GitHub « Prix quotidiens » une première fois.');
  const c=compute(),own=k=>Object.values(c.inv).find(i=>i.qty>0&&String(i.code||'').toUpperCase()===String(k||'').toUpperCase())||null;
  const box=h('div');
  {const dd=Math.floor((Date.now()-Date.parse(sig.updated))/864e5);if(dd>=2)box.append(h('div',{class:'toast',style:'color:var(--bad)'},'⚠️ Données vieilles de '+dd+' jours : la mise à jour automatique ne tourne plus (voir l’onglet Actions sur GitHub).'))}
  box.append(h('div',{class:'sub'},'Mis à jour : '+sig.updated+' · '+sig.source+' · prix en $ · hausses/baisses : cartes ≥ 5 $'));
  const F=[['opp','Opportunités'],['stock','Mon stock'],['up','Hausses US'],['down','Baisses US'],['cat','Catalogue']];
  box.append(h('div',{class:'seg',style:'grid-template-columns:repeat(3,1fr);margin-bottom:10px'},F.map(([k,l])=>h('button',{type:'button',class:sigF===k?'on':'',onclick:()=>{sigF=k;render()}},l))));
  if(sigF==='cat')return viewCat(box,own);
  if(sigF==='opp')return viewOpp(box);
  let r=sig.rows;
  r=sigF==='stock'?r.filter(x=>own(x.c)):sigF==='up'?r.filter(x=>x.d7>0&&x.p>=5).sort((a,b)=>b.d7-a.d7):r.filter(x=>x.d7<0&&x.p>=5).sort((a,b)=>a.d7-b.d7);
  if(!r.length){box.append(h('div',{class:'empty'},sigF==='stock'?'Aucune carte de ton stock dans les signaux (le code doit correspondre, ex : OP05-119).':'Rien à signaler.'));return box}
  const pc=n=>(n>0?'+':'')+(n==null?'–':n.toFixed(1)+' %');
  box.append(h('div',{class:'card'},r.slice(0,50).map(x=>{const o=own(x.c);const nm=/^https:\/\//.test(x.u||'')?h('a',{href:x.u,target:'_blank',rel:'noopener',style:'color:inherit;font-weight:700'},x.n):h('b',{},x.n);
    return h('div',{class:'row'},h('div',{},nm,h('div',{class:'sm'},[x.c,x.s,'$'+x.p.toFixed(2),'24 h '+pc(x.d1)].join(' · ')),o?h('div',{class:'sm'},'📦 en stock ×'+o.qty+' · coût moy. '+eur(o.cost/o.qty)):''),h('b',{class:x.d7>=0?'pos':'neg'},pc(x.d7)))})));
  box.append(h('div',{class:'sub',style:'margin-top:12px'},'Signaux de tendance (marché US), pas des garanties. Vérifie le prix sur Cardmarket avant d’agir.'));
  return box;
}
const ctLine=ct=>ct?h('div',{class:'sm'},'🛒 CardTrader : '+Object.entries(ct).sort((a,b)=>(a[0]==='EN'?-1:b[0]==='EN'?1:0)).map(([l,v])=>l+' '+eur(v[0])).join(' · ')):'';
const FEE=0.05,SELL_PCT=20,DEAL_PCT=15,MOM_PCT=15,MINP=8;
function cmFor(code,ver){
  const l=((sig.cm&&sig.cm.rows)||[]).filter(x=>x.c===String(code||'').toUpperCase());if(!l.length)return null;
  const v=(ver||'').trim().toUpperCase();
  return l.find(x=>v?x.v.toUpperCase()===v:x.v==='V.1')||(v?null:l[0]);
}
function cmRow(m,tags,right,extra){
  const nm=/^https:\/\//.test(m.u||'')?h('a',{href:m.u,target:'_blank',rel:'noopener',style:'color:inherit;font-weight:700'},m.n):h('b',{},m.n);
  return h('div',{class:'row'},h('div',{},nm,h('div',{class:'sm'},[m.c,m.v,'tendance '+eur(m.e),m.l!=null?'min. '+eur(m.l):''].filter(Boolean).join(' · ')),extra||'',h('div',{},tags.map(t=>h('span',{class:'tag'},t)))),right);
}
const SHIP=1.0,MOM_UP=10;
let bud=(()=>{const d={min:5,max:70,mar:10};try{return Object.assign(d,JSON.parse(localStorage.getItem('opp_bud')||'{}'))}catch(e){return d}})();
function viewOpp(box){
  if(!sig.cm||!sig.cm.rows||!sig.cm.rows.length){box.append(h('div',{class:'empty'},'Les prix Cardmarket ne sont pas encore dans le fichier. Mets à jour fetch_prices.py puis relance « Prix quotidiens ».'));return box}
  const c=compute(),pc=n=>(n>0?'+':'')+n.toFixed(0)+' %',cur=n=>h('b',{class:n>=0?'pos':'neg'},pc(n));
  const setB=(k,v)=>{bud[k]=v;try{localStorage.setItem('opp_bud',JSON.stringify(bud))}catch(e){}render()};
  const num=(k,l)=>h('div',{},h('label',{},l),h('input',{type:'number',min:'0',value:bud[k],inputmode:'decimal',onchange:e=>setB(k,parseFloat(e.target.value)||0)}));
  box.append(h('div',{class:'sub'},'Cardmarket + CardTrader + TCGplayer · prix en € · fichier du '+sig.cm.updated));
  box.append(h('div',{class:'card'},h('div',{class:'two'},num('min','Budget min (€)'),num('max','Budget max (€)')),num('mar','Marge nette minimale (%)')));
  // --- ton stock
  const sells=Object.values(c.inv).filter(x=>x.qty>0).map(x=>{
    const m=cmFor(x.code,x.ver);if(!m)return null;
    const avg=x.cost/x.qty,p=avg>0?(m.e*(1-FEE)-avg)/avg*100:0,tags=[];
    const down=m.a7!=null&&m.a30!=null&&m.a7<m.a30*0.9,up=m.a7!=null&&m.a30!=null&&m.a7>m.a30*1.1;
    if(p>=SELL_PCT)tags.push('plus-value latente');
    if(p>0&&down)tags.push('tendance en baisse : sécuriser le gain');
    if(p>0&&up)tags.push('en hausse : tu peux attendre');
    if(p<0&&down)tags.push('perte latente + baisse : à surveiller');
    return tags.length?{x,m,avg,p,tags}:null}).filter(Boolean).sort((a,b)=>b.p-a.p);
  box.append(h('h2',{},'À vendre ? (ton stock)'));
  box.append(sells.length?h('div',{class:'card'},sells.map(s=>cmRow(s.m,s.tags,cur(s.p),h('div',{},h('div',{class:'sm'},'×'+s.x.qty+' · coût moy. '+eur(s.avg)+(s.x.ver?'':' · version V.1 supposée')),ctLine(s.m.ct))))):h('div',{class:'empty'},'Aucun signal sur ton stock (renseigne le code des cartes, ex : OP05-119).'));
  // --- achats dans le budget
  const pool=sig.cm.rows.filter(m=>m.e>=bud.min&&m.e<=bud.max);
  const arb=pool.map(m=>{
    const ct=m.ct&&m.ct.EN?m.ct.EN[0]:null,buy=ct!=null?ct:m.l;
    if(buy==null||buy>=m.e)return null;
    const cost=buy+SHIP,margin=(m.e*(1-FEE)-cost)/cost*100;
    return margin>=bud.mar?{m,buy,margin,verified:ct!=null}:null}).filter(Boolean)
    .sort((a,b)=>(b.verified-a.verified)||(b.margin-a.margin)).slice(0,20);
  box.append(h('h2',{},'Arbitrage Europe (achat → revente)'));
  box.append(arb.length?h('div',{class:'card'},arb.map(a=>cmRow(a.m,[a.verified?'✅ prix CardTrader EN (NM)':'⚠️ annonce Cardmarket : langue/état à vérifier'],
    h('div',{style:'text-align:right'},h('b',{class:'pos'},pc(a.margin)),h('div',{class:'sm'},'achat '+eur(a.buy)+' → '+eur(a.m.e))),ctLine(a.m.ct)))):h('div',{class:'empty'},'Aucune carte avec une marge nette ≥ '+bud.mar+' % dans ce budget.'));
  const trends=pool.map(m=>{
    const tags=[],src=['Cardmarket'];let s=0;
    const mom=m.a7!=null&&m.a30>0?(m.a7/m.a30-1)*100:null;
    if(mom!=null&&mom>=MOM_PCT){tags.push('momentum Europe '+pc(mom));s+=mom/2}
    if(m.ud7!=null){
      if(m.ud7>=MOM_UP){src.push('TCGplayer');
        if(mom!=null&&mom>=MOM_PCT){tags.push('US aussi en hausse '+pc(m.ud7)+' : sources concordantes');s+=15}
        else if(mom==null||mom<=5){tags.push('hausse US '+pc(m.ud7)+' pas encore en Europe');s+=m.ud7/2}}
      if(mom!=null&&mom<=-MOM_PCT&&m.ud7>=0){src.push('TCGplayer');tags.push('baisse isolée en Europe (US stable)');s+=Math.abs(mom)/3}}
    if(m.x!=null&&m.x<=-20){if(!src.includes('TCGplayer'))src.push('TCGplayer');tags.push('≈'+Math.abs(m.x).toFixed(0)+' % moins cher qu’aux US');s+=Math.abs(m.x)/2}
    const n=m.ct&&m.ct.EN?m.ct.EN[1]:null;
    if(m.ct){src.push('CardTrader');if(n!=null&&n<=3){tags.push('peu d’offres EN sur CardTrader ('+n+')');s+=5}}
    return s>0?{m,tags,s,src}:null}).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,25);
  box.append(h('h2',{},'Tendances à étudier'));
  box.append(trends.length?h('div',{class:'card'},trends.map(t=>cmRow(t.m,t.tags.concat(['sources : '+t.src.join(' + ')]),h('b',{},eur(t.m.e)),ctLine(t.m.ct)))):h('div',{class:'empty'},'Rien de notable dans ce budget.'));
  box.append(h('div',{class:'sub',style:'margin-top:12px'},'Pistes, pas des conseils. Marge = (tendance Cardmarket − 5 % de frais − prix d’achat − 1 € de port) / coût. La tendance Cardmarket mélange toutes les langues et tous les états : vérifie l’annonce avant d’acheter.'));
  return box;
}
const RANK=['common','uncommon','rare','leader','super rare','secret rare','special','treasure','manga','promo'];
const rk=r=>{const l=String(r||'').toLowerCase();let b=-1,n=0;RANK.forEach((k,i)=>{if(l.includes(k)&&k.length>n){b=i;n=k.length}});return b};
const nz=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const SORT_LABELS={price_desc:'Prix décroissant',price_asc:'Prix croissant',name_asc:'Nom A → Z',name_desc:'Nom Z → A',rar_desc:'Rareté (haute d’abord)',rar_asc:'Rareté (basse d’abord)',date_desc:'Sortie : récent d’abord',date_asc:'Sortie : ancien d’abord',chg_desc:'Hausse sur 7 j'};
function viewCat(box,own){
  const rows=sig.rows,sets=sig.sets||{};
  if(!rows.some(x=>x.t)){box.append(h('div',{class:'empty'},'Relance « Prix quotidiens » sur GitHub : le fichier n’a pas encore les raretés.'));return box}
  const sd=x=>(sets[x.g]||{}).d||'';
  const C={price_desc:(a,b)=>b.p-a.p,price_asc:(a,b)=>a.p-b.p,name_asc:(a,b)=>a.n.localeCompare(b.n,'fr'),name_desc:(a,b)=>b.n.localeCompare(a.n,'fr'),
    rar_desc:(a,b)=>rk(b.r)-rk(a.r)||b.p-a.p,rar_asc:(a,b)=>rk(a.r)-rk(b.r)||a.p-b.p,
    date_desc:(a,b)=>sd(b).localeCompare(sd(a))||a.c.localeCompare(b.c),date_asc:(a,b)=>sd(a).localeCompare(sd(b))||a.c.localeCompare(b.c),
    chg_desc:(a,b)=>(b.d7==null?-1e9:b.d7)-(a.d7==null?-1e9:a.d7)};
  const uniq=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'fr'));
  const edLabel=g=>{const e=sets[g]||{};return (e.a?e.a+' — ':'')+(e.n||g)};
  const ctl=h('div'),out=h('div');
  const sel=(k,opts,all)=>h('select',{onchange:e=>{cat[k]=e.target.value;if(k==='t')cat.g='';cat.n=100;ctls();draw()}},h('option',{value:''},all),opts.map(o=>h('option',{value:o[0],...(String(cat[k])===String(o[0])?{selected:''}:{})},o[1])));
  function ctls(){
    const gids=[...new Set(rows.filter(x=>!cat.t||x.t===cat.t).map(x=>x.g).filter(g=>g!=null))].sort((a,b)=>((sets[b]||{}).d||'').localeCompare((sets[a]||{}).d||''));
    ctl.replaceChildren(
      h('label',{},'Recherche'),h('input',{type:'search',placeholder:'Nom, code (OP05-119), édition…',value:cat.q,oninput:e=>{cat.q=e.target.value;cat.n=100;draw()}}),
      h('div',{class:'two'},h('div',{},h('label',{},'Série'),sel('t',uniq(rows.map(x=>x.t)).map(t=>[t,t]),'Toutes')),h('div',{},h('label',{},'Édition'),sel('g',gids.map(g=>[g,edLabel(g)]),'Toutes'))),
      h('div',{class:'two'},h('div',{},h('label',{},'Rareté'),sel('r',uniq(rows.map(x=>x.r)).sort((a,b)=>rk(a)-rk(b)).map(r=>[r,r]),'Toutes')),h('div',{},h('label',{},'Variante'),sel('v',uniq(rows.map(x=>x.q)).map(v=>[v,v]),'Toutes'))),
      h('div',{class:'two'},h('div',{},h('label',{},'Prix min. ($)'),h('input',{type:'number',min:'0',step:'1',value:cat.min,inputmode:'decimal',onchange:e=>{cat.min=parseFloat(e.target.value)||0;draw()}})),
        h('div',{},h('label',{},'Tri'),h('select',{onchange:e=>{cat.sort=e.target.value;draw()}},Object.entries(SORT_LABELS).map(([k,l])=>h('option',{value:k,...(cat.sort===k?{selected:''}:{})},l))))));
  }
  function draw(){
    const toks=nz(cat.q).split(/\s+/).filter(Boolean);
    let r=rows.filter(x=>(!cat.t||x.t===cat.t)&&(!cat.g||String(x.g)===String(cat.g))&&(!cat.r||x.r===cat.r)&&(!cat.v||x.q===cat.v)&&x.p>=cat.min);
    if(toks.length)r=r.filter(x=>{const e=sets[x.g]||{},hay=nz([x.n,x.c,e.n,e.a,x.r,x.q].join(' '));return toks.every(t=>hay.includes(t))});
    r.sort(C[cat.sort]||C.price_desc);
    const kids=[h('div',{class:'sub',style:'margin-top:10px'},r.length+' cartes · prix US en $ (version anglaise)')];
    kids.push(r.length?h('div',{class:'card'},r.slice(0,cat.n).map(x=>{
      const e=sets[x.g]||{},o=own(x.c),nm=/^https:\/\//.test(x.u||'')?h('a',{href:x.u,target:'_blank',rel:'noopener',style:'color:inherit;font-weight:700'},x.n):h('b',{},x.n);
      return h('div',{class:'row'},h('div',{},nm,
        h('div',{class:'sm'},[x.c,e.a||x.s,x.r,x.q&&x.q!=='Standard'?x.q:''].filter(Boolean).join(' · ')),
        e.n?h('div',{class:'sm'},e.n+(e.d?' · sortie '+e.d:'')):'',ctLine(x.ct),
        o?h('div',{class:'sm'},'📦 en stock ×'+o.qty):''),
        h('div',{style:'text-align:right'},h('b',{},'$'+x.p.toFixed(2)),x.e!=null?h('div',{class:'sm'},'≈ '+eur(x.e)+' Cardmarket'):'',
          h('div',{class:'sm '+(x.d7>0?'pos':x.d7<0?'neg':'')},x.d7==null?'':(x.d7>0?'+':'')+x.d7+' %')))})):h('div',{class:'empty'},'Aucune carte.'));
    if(r.length>cat.n)kids.push(h('button',{class:'btn',onclick:()=>{cat.n+=100;draw()}},'Afficher plus ('+(r.length-cat.n)+')'));
    kids.push(h('div',{class:'sub',style:'margin-top:12px'},'Prix TCGplayer = version anglaise. Cardmarket mélange toutes les langues : son prix en € n’apparaît que si la carte est unique des deux côtés.'));
    out.replaceChildren(...kids);
  }
  ctls();draw();box.append(ctl,out);return box;
}
function render(){
  const v=document.getElementById('view');v.replaceChildren(tab==='sum'?viewSum():tab==='add'?viewAdd():tab==='hist'?viewHist():tab==='sig'?viewSig():viewStock());

}
