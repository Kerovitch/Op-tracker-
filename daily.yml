name: Prix quotidiens
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "43 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prix-quotidiens
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_prices.py
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Prix $(date -u +%F)" || exit 0
          git pull --rebase
          git push
      - name: Alerte en cas d'échec
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Content-Type: application/json" -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"⚠️ Mise à jour échouée\",\"message\":\"Prix quotidiens a échoué : ouvre l'onglet Actions sur GitHub.\",\"priority\":4}" https://ntfy.sh || true
