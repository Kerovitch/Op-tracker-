name: Prix quotidiens
on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "43 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prix-quotidiens
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_prices.py
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
      - run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Prix $(date -u +%F)" || exit 0
          git push
